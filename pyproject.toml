[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-statement-parser"
version = "1.0.0"
description = "Shared bank statement PDF parsing core with desktop and web adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pymupdf>=1.24",
  "python-bidi>=0.6",
  "openpyxl>=3.1",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "groq>=0.9",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
bank-parser = "bank_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
